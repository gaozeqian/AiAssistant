name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 最小权限：除显式提权的 job 外，GITHUB_TOKEN 只读。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CI: "true"

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'nuget.config', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore AiAssistant.sln

      - name: Verify code formatting
        run: dotnet format AiAssistant.sln --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build AiAssistant.sln -c Release --no-restore --warnaserror

      - name: Run tests (Microsoft.Testing.Platform)
        env:
          AIASSISTANT_SOAK_DAYS: "3"
        run: dotnet test --solution AiAssistant.sln -c Release --no-build

      - name: Upload multi-day soak report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soak-report-${{ matrix.rid }}
          path: artifacts/evidence/soak/*.md
          if-no-files-found: ignore

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-reports-${{ matrix.rid }}
          path: artifacts/evidence/benchmarks/*.md
          if-no-files-found: ignore

      - name: Build & Smoke-Test Swift Helper (macOS arm64)
        if: matrix.rid == 'osx-arm64'
        working-directory: native/AiAssistant.MacHelper
        run: |
          swift build -c release
          .build/release/aiassistant-mac-helper --smoke-check

      - name: Verify RID Native Asset Packaging (${{ matrix.rid }})
        run: dotnet publish src/AiAssistant.Host/AiAssistant.Host.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Verify Swift Helper Is Bundled (macOS arm64)
        if: matrix.rid == 'osx-arm64'
        run: test -x artifacts/publish/AiAssistant.Host/release_${{ matrix.rid }}/aiassistant-mac-helper

      - name: Verify Linux Portal Adapter Is Bundled (linux-x64)
        if: matrix.rid == 'linux-x64'
        run: test -f artifacts/publish/AiAssistant.Host/release_${{ matrix.rid }}/Tmds.DBus.Protocol.dll

  package:
    name: Package (${{ matrix.rid }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Build Swift Helper (macOS arm64)
        if: matrix.rid == 'osx-arm64'
        working-directory: native/AiAssistant.MacHelper
        run: swift build -c release

      - name: Package (Windows, unsigned developer build)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./build/package/package-windows.ps1

      - name: Package (macOS, layout only)
        if: matrix.rid == 'osx-arm64'
        run: bash build/package/package-macos.sh --skip-sign

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        run: bash build/package/package-linux.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            artifacts/package/*.zip
            artifacts/package/*.tar.gz
            artifacts/package/*.deb
            artifacts/package/SHA256SUMS
          if-no-files-found: error

  sbom-and-licenses:
    name: SBOM & License Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, generate and verify offline CycloneDX SBOM
        run: |
          dotnet restore AiAssistant.sln
          python3 build/sbom/generate-sbom.py --verify --check-manifest

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: artifacts/build/sbom/bom.json

  conventions:
    name: Repository Conventions Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Audit R1-R10 conventions
        run: bash tools/audit-conventions.sh

      - name: ShellCheck POSIX scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck "${scripts[@]}"

      - name: Verify clean-artifacts help (BSD/GNU compatible entry)
        run: bash tools/clean-artifacts.sh --help
