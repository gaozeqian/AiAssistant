name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CI: "true"

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AiAssistant.sln

      - name: Verify code formatting & build
        run: dotnet build AiAssistant.sln -c Release --no-restore

      - name: Run Architecture, Unit, Integration & Contract Tests
        env:
          AIASSISTANT_SOAK_DAYS: "3"
        run: dotnet test AiAssistant.sln -c Release --no-build --logger "trx;LogFileName=test-results-${{ matrix.rid }}.trx"

      - name: Upload multi-day soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-${{ matrix.rid }}
          path: artifacts/soak/*.md
          if-no-files-found: ignore

      - name: Build & Smoke-Test Swift Helper (macOS arm64)
        if: matrix.rid == 'osx-arm64'
        working-directory: native/AiAssistant.MacHelper
        run: |
          swift build -c release
          .build/release/aiassistant-mac-helper --smoke-check

      - name: Verify RID Native Asset Packaging (${{ matrix.rid }})
        run: dotnet publish src/AiAssistant.Host/AiAssistant.Host.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o artifacts/publish/${{ matrix.rid }}

      - name: Verify Swift Helper Is Bundled (macOS arm64)
        if: matrix.rid == 'osx-arm64'
        run: test -x artifacts/publish/osx-arm64/aiassistant-mac-helper

      - name: Verify Linux Portal Adapter Is Bundled (linux-x64)
        if: matrix.rid == 'linux-x64'
        run: test -f artifacts/publish/linux-x64/Tmds.DBus.Protocol.dll

  package:
    name: Package (${{ matrix.rid }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Swift Helper (macOS arm64)
        if: matrix.rid == 'osx-arm64'
        working-directory: native/AiAssistant.MacHelper
        run: swift build -c release

      - name: Package (Windows, unsigned developer build)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./build/package/package-windows.ps1

      - name: Package (macOS, layout only)
        if: matrix.rid == 'osx-arm64'
        run: bash build/package/package-macos.sh --skip-sign

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        run: bash build/package/package-linux.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.tar.gz
            artifacts/packages/*.deb
            artifacts/packages/SHA256SUMS
          if-no-files-found: error

  sbom-and-licenses:
    name: SBOM & License Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, generate and verify offline CycloneDX SBOM
        run: |
          dotnet restore AiAssistant.sln
          python3 build/sbom/generate-sbom.py --verify --check-manifest

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: artifacts/sbom/bom.json
