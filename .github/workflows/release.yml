name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}

jobs:
  windows:
    name: Windows signed package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore & test
        run: |
          dotnet restore AiAssistant.sln
          dotnet test AiAssistant.sln -c Release

      - name: Import code-signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          "AIASSISTANT_SIGN_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package (MSIX + zip)
        shell: pwsh
        env:
          AIASSISTANT_TIMESTAMP_URL: ${{ secrets.AIASSISTANT_TIMESTAMP_URL }}
        run: ./build/package/package-windows.ps1 -Version $env:APP_VERSION -Msix -RequireSigning -Publisher "${{ secrets.WINDOWS_MSIX_PUBLISHER }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: artifacts/packages/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-win-x64-msix
          path: artifacts/packages/*.msix
          if-no-files-found: warn

  macos:
    name: macOS signed & notarized package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore & test
        run: |
          dotnet restore AiAssistant.sln
          dotnet test AiAssistant.sln -c Release
      - name: Build Swift helper
        working-directory: native/AiAssistant.MacHelper
        run: swift build -c release

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials aiassistant-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD"

      - name: Package, sign and notarize
        env:
          AIASSISTANT_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          AIASSISTANT_NOTARY_PROFILE: aiassistant-notary
        run: bash build/package/package-macos.sh --version "$APP_VERSION" --require-sign

      - uses: actions/upload-artifact@v4
        with:
          name: release-osx-arm64
          path: artifacts/packages/*.zip
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore & test
        run: |
          dotnet restore AiAssistant.sln
          dotnet test AiAssistant.sln -c Release
      - name: Package (tar.gz + deb)
        run: bash build/package/package-linux.sh --version "$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            artifacts/packages/*.tar.gz
            artifacts/packages/*.deb
          if-no-files-found: error

  publish:
    name: Attach artifacts to GitHub Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Normalize version
        id: version
        run: echo "value=${APP_VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: AiAssistant ${{ steps.version.outputs.value }}
          draft: true
          files: dist/*
