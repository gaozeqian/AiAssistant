name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      dev_self_signed:
        description: "Explicitly build a DEVELOPER self-signed release (imports local trust roots)"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

# 最小权限：只有 publish job 需要写 Release。
permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
  # tag 推送一律视为正式签名路径；只有手动触发并显式勾选才是开发自签名。
  DEV_SELF_SIGNED: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.dev_self_signed }}

jobs:
  windows:
    name: Windows zip + MSI
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & test
        run: |
          dotnet restore AiAssistant.sln
          dotnet test --solution AiAssistant.sln -c Release

      - name: Create self-signed code-signing certificate (dev only)
        if: env.DEV_SELF_SIGNED == 'true'
        shell: pwsh
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=AiAssistant Self-Signed" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(1)
          $cer = Join-Path $env:GITHUB_WORKSPACE "artifacts/dist/$version/AiAssistant-$version-windows-x64-dev.cer"
          New-Item -ItemType Directory -Force (Split-Path $cer) | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          # 仅开发自签名模式导入本机信任库；正式 CA 路径绝不修改 runner 或用户信任库。
          certutil -user -addstore -f Root $cer | Out-Null
          certutil -user -addstore -f TrustedPeople $cer | Out-Null
          "AIASSISTANT_SIGN_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Verify production signing identity (non-dev)
        if: env.DEV_SELF_SIGNED != 'true'
        shell: pwsh
        env:
          AIASSISTANT_PROD_SIGN_THUMBPRINT: ${{ secrets.AIASSISTANT_PROD_SIGN_THUMBPRINT }}
          AIASSISTANT_PROD_CERT_BASE64: ${{ secrets.AIASSISTANT_PROD_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AIASSISTANT_PROD_SIGN_THUMBPRINT) -or
              [string]::IsNullOrWhiteSpace($env:AIASSISTANT_PROD_CERT_BASE64)) {
            throw "Production release requires AIASSISTANT_PROD_SIGN_THUMBPRINT and AIASSISTANT_PROD_CERT_BASE64 (real CA certificate)."
          }
          $version = $env:APP_VERSION.TrimStart('v')
          $cer = Join-Path $env:GITHUB_WORKSPACE "artifacts/dist/$version/AiAssistant-$version-windows-x64.cer"
          New-Item -ItemType Directory -Force (Split-Path $cer) | Out-Null
          [IO.File]::WriteAllBytes($cer, [Convert]::FromBase64String($env:AIASSISTANT_PROD_CERT_BASE64))
          "AIASSISTANT_SIGN_CERT_THUMBPRINT=$env:AIASSISTANT_PROD_SIGN_THUMBPRINT" >> $env:GITHUB_ENV

      - name: Fetch bundled voice models
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build/models/fetch-bundle.sh

      - name: Build and sign portable zip
        shell: pwsh
        run: |
          $dev = if ($env:DEV_SELF_SIGNED -eq 'true') { @('-DevSelfSigned') } else { @() }
          ./build/package/package-windows.ps1 -Version $env:APP_VERSION -RequireSigning @dev

      - name: Build and sign MSI from shared payload
        shell: pwsh
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          $certName = if ($env:DEV_SELF_SIGNED -eq 'true') { "AiAssistant-$version-windows-x64-dev.cer" } else { "AiAssistant-$version-windows-x64.cer" }
          $cert = "artifacts/dist/$version/$certName"
          $dev = if ($env:DEV_SELF_SIGNED -eq 'true') { @('-DevSelfSigned', '-CertificatePath', $cert) } else { @() }
          ./build/package/package-windows-msi.ps1 `
            -Version $env:APP_VERSION `
            -SignThumbprint $env:AIASSISTANT_SIGN_CERT_THUMBPRINT @dev

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-win-x64
          path: |
            artifacts/dist/**/*.zip
            artifacts/dist/**/*.msi
            artifacts/dist/**/*.cer
            artifacts/dist/**/*.sha256
            artifacts/dist/**/AiAssistant-*-SHA256SUMS.txt
          if-no-files-found: error

  macos:
    name: macOS pkg + zip
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & test
        run: |
          dotnet restore AiAssistant.sln
          dotnet test --solution AiAssistant.sln -c Release

      - name: Build Swift helper
        run: bash build/native/mac-helper.sh build

      - name: Test Swift helper
        run: bash build/native/mac-helper.sh test

      - name: Create self-signed signing identity (dev only)
        if: env.DEV_SELF_SIGNED == 'true'
        run: |
          version="${APP_VERSION#v}"
          mkdir -p "artifacts/dist/$version"
          bash build/package/macos/create-self-signed-identity.sh \
            "$GITHUB_WORKSPACE/artifacts/dist/$version/AiAssistant-$version-macos-arm64-dev.cer" \
            "AiAssistant Self-Signed"

      - name: Fetch bundled voice models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build/models/fetch-bundle.sh

      - name: Package dev self-signed (imports local trust root)
        if: env.DEV_SELF_SIGNED == 'true'
        env:
          AIASSISTANT_CODESIGN_IDENTITY: AiAssistant Self-Signed
        run: |
          version="${APP_VERSION#v}"
          bash build/package/package-macos.sh \
            --version "$APP_VERSION" \
            --require-sign \
            --dev-self-signed \
            --certificate "artifacts/dist/$version/AiAssistant-$version-macos-arm64-dev.cer"

      - name: Package production Developer ID (no trust-store changes)
        if: env.DEV_SELF_SIGNED != 'true'
        env:
          AIASSISTANT_CODESIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID }}
          AIASSISTANT_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          if [ -z "$AIASSISTANT_CODESIGN_IDENTITY" ]; then
            echo "Production release requires MACOS_DEVELOPER_ID secret." >&2
            exit 1
          fi
          bash build/package/package-macos.sh --version "$APP_VERSION" --require-sign

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-osx-arm64
          path: |
            artifacts/dist/**/*.pkg
            artifacts/dist/**/*.zip
            artifacts/dist/**/*.cer
            artifacts/dist/**/*.sha256
            artifacts/dist/**/AiAssistant-*-SHA256SUMS.txt
          if-no-files-found: error

  linux:
    name: Linux tar.gz + deb
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & test
        run: |
          dotnet restore AiAssistant.sln
          dotnet test --solution AiAssistant.sln -c Release

      - name: Fetch bundled voice models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build/models/fetch-bundle.sh

      - name: Package tar.gz and deb
        run: bash build/package/package-linux.sh --version "$APP_VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-x64
          path: |
            artifacts/dist/**/*.tar.gz
            artifacts/dist/**/*.deb
            artifacts/dist/**/*.sha256
            artifacts/dist/**/AiAssistant-*-SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Generate SBOM
        run: |
          dotnet restore AiAssistant.sln
          python3 build/sbom/generate-sbom.py --verify --check-manifest

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Normalize version
        id: version
        run: echo "value=${APP_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Stage SBOM and checksums
        run: |
          version="${{ steps.version.outputs.value }}"
          mkdir -p dist
          cp "artifacts/dist/$version/AiAssistant-$version-sbom.cdx.json" dist/
          bash build/package/checksums.sh "$PWD/dist" "$version"

      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: AiAssistant ${{ steps.version.outputs.value }}
          draft: true
          prerelease: true
          body: |
            AiAssistant ${{ steps.version.outputs.value }} — 三平台交付物。

            | 平台 | 交付物 | 签名 / 信任方式 |
            |---|---|---|
            | Windows x64 | `AiAssistant-<ver>-windows-x64-portable.zip` + `.msi` | 正式 CA 签名；开发自签名产物带 `-dev` |
            | macOS arm64 | `AiAssistant-<ver>-macos-arm64.pkg` + `.app.zip` | Developer ID 签名；开发自签名产物带 `-dev` |
            | Linux x64 | `aiassistant-<ver>-linux-x64.tar.gz` + `aiassistant_<ver>_amd64.deb` | 未签名 |

            安装包由 GitHub Actions 在本工作流中构建；附 `AiAssistant-<ver>-sbom.cdx.json` 与 `AiAssistant-<ver>-SHA256SUMS.txt`。
            开发自签名版本必须显式在手动触发时勾选 `dev_self_signed`，tag 推送走正式签名路径。
          files: dist/*
