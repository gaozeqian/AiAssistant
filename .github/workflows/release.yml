name: Release (self-signed MSI/PKG/deb)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}

jobs:
  windows:
    name: Windows MSI (self-signed)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & test
        run: |
          dotnet restore AiAssistant.sln
          dotnet test AiAssistant.sln -c Release

      - name: Create self-signed code-signing certificate
        shell: pwsh
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=AiAssistant Self-Signed" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(1)
          $cer = Join-Path $env:GITHUB_WORKSPACE "artifacts/packages/AiAssistant-$version-win-x64.cer"
          New-Item -ItemType Directory -Force (Split-Path $cer) | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          certutil -user -addstore -f Root $cer | Out-Null
          certutil -user -addstore -f TrustedPeople $cer | Out-Null
          "AIASSISTANT_SIGN_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build and sign MSI
        shell: pwsh
        run: |
          ./build/package/package-windows-msi.ps1 `
            -Version $env:APP_VERSION `
            -CertificatePath "artifacts/packages/AiAssistant-$($env:APP_VERSION.TrimStart('v'))-win-x64.cer" `
            -SignThumbprint $env:AIASSISTANT_SIGN_CERT_THUMBPRINT

      - uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: |
            artifacts/packages/*.msi
            artifacts/packages/*.cer
          if-no-files-found: error

  macos:
    name: macOS PKG (self-signed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & test
        run: |
          dotnet restore AiAssistant.sln
          dotnet test AiAssistant.sln -c Release

      - name: Build Swift helper
        working-directory: native/AiAssistant.MacHelper
        run: swift build -c release

      - name: Create self-signed signing identity
        run: |
          version="${APP_VERSION#v}"
          mkdir -p artifacts/packages
          bash build/package/macos/create-self-signed-identity.sh \
            "$GITHUB_WORKSPACE/artifacts/packages/AiAssistant-$version-osx-arm64.cer" \
            "AiAssistant Self-Signed"

      - name: Package, sign and create PKG
        env:
          AIASSISTANT_CODESIGN_IDENTITY: AiAssistant Self-Signed
        run: |
          version="${APP_VERSION#v}"
          bash build/package/package-macos.sh \
            --version "$APP_VERSION" \
            --require-sign \
            --certificate "artifacts/packages/AiAssistant-$version-osx-arm64.cer"

      - uses: actions/upload-artifact@v4
        with:
          name: release-osx-arm64
          path: |
            artifacts/packages/*.pkg
            artifacts/packages/*.cer
          if-no-files-found: error

  linux:
    name: Linux deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & test
        run: |
          dotnet restore AiAssistant.sln
          dotnet test AiAssistant.sln -c Release

      - name: Package deb
        run: bash build/package/package-linux.sh --version "$APP_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: artifacts/packages/*.deb
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate SBOM
        run: |
          dotnet restore AiAssistant.sln
          python3 build/sbom/generate-sbom.py --verify --check-manifest

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Normalize version
        id: version
        run: echo "value=${APP_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Stage SBOM and checksums
        run: |
          cp artifacts/sbom/bom.json dist/bom.json
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: AiAssistant ${{ steps.version.outputs.value }}
          draft: true
          prerelease: true
          body: |
            AiAssistant ${{ steps.version.outputs.value }} — 三平台自签名安装包。

            | 平台 | 安装包 | 签名 |
            |---|---|---|
            | Windows x64 | `.msi` | 自签名 Authenticode，安装时导入证书 |
            | macOS arm64 | `.pkg` | 自签名 codesign，postinstall 导入证书 |
            | Linux x64 | `.deb` | 未签名 |

            安装包由 GitHub Actions 在本工作流中构建；附 `.cer` 公钥证书与 `SHA256SUMS`。
            Windows MSI 会以管理员权限运行 `certutil` 导入证书；macOS PKG 会以 root 运行 `security add-trusted-cert`。
            自签名证书不会被系统默认信任；macOS 版本未公证。
          files: dist/*
